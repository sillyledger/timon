<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mochi — a gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090A;
    --surface: #151517;
    --line: rgba(255,255,255,0.10);
    --line-soft: rgba(255,255,255,0.05);
    --text: #F3F3F0;
    --text-dim: #9E9D99;
    --text-faint: #5B5A56;
    --accent: #E2643F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
  }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 56px 32px 64px; }

  header { margin-bottom: 72px; }
  .wordmark { font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.02em; }

  .trail-zone { position: relative; }

  .paw-mark { position: absolute; opacity: 0.15; pointer-events: none; }

  .hero { margin-bottom: 40px; max-width: 620px; }
  .hero h1 {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 48px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0 0 22px;
  }
  .hero p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1.8;
    color: var(--text-dim);
    max-width: 44ch;
    margin: 0;
  }

  /* --- segmented pill control --- */
  .pills-frame {
    display: inline-flex;
    gap: 4px;
    padding: 5px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    margin-bottom: 48px;
  }
  .pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 7px 16px;
    border-radius: 999px;
    border: none;
    background: none;
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .pill:hover { color: var(--text); }
  .pill:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
  .pill.active { background: var(--text); color: var(--bg); }

  /* --- grid, larger showcase --- */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px 20px; margin-bottom: 56px; }
  figure { margin: 0; }
  .frame {
    aspect-ratio: 4/5;
    background: var(--surface);
    border: 1px solid var(--line);
    margin-bottom: 12px;
  }
  figcaption {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .divider { border: none; border-top: 1px solid var(--line-soft); margin: 0 0 24px; }
  footer {
    display: flex; align-items: baseline; justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-faint);
    letter-spacing: 0.02em; flex-wrap: wrap; gap: 8px;
  }
  footer .status { color: var(--accent); }

  @media (max-width: 760px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .hero h1 { font-size: 36px; }
    .paw-mark { display: none; }
  }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header><div class="wordmark">mochi</div></header>

  <div class="trail-zone">
    <svg class="paw-mark" style="top:6px; left:600px; width:18px;" viewBox="0 0 24 24" fill="none" stroke="#F3F3F0" stroke-width="1.3" transform="rotate(-12)"><circle cx="7" cy="8" r="1.8"/><circle cx="12" cy="6" r="1.8"/><circle cx="17" cy="8" r="1.8"/><path d="M8 14.2c0-2.3 1.9-4.2 4-4.2s4 1.9 4 4.2c0 2.3-1.9 3.6-4 3.6s-4-1.3-4-3.6z"/></svg>
    <svg class="paw-mark" style="top:64px; left:566px; width:16px;" viewBox="0 0 24 24" fill="none" stroke="#F3F3F0" stroke-width="1.3" transform="rotate(10)"><circle cx="7" cy="8" r="1.8"/><circle cx="12" cy="6" r="1.8"/><circle cx="17" cy="8" r="1.8"/><path d="M8 14.2c0-2.3 1.9-4.2 4-4.2s4 1.9 4 4.2c0 2.3-1.9 3.6-4 3.6s-4-1.3-4-3.6z"/></svg>
    <svg class="paw-mark" style="top:126px; left:520px; width:16px; opacity:0.13" viewBox="0 0 24 24" fill="none" stroke="#F3F3F0" stroke-width="1.3" transform="rotate(-9)"><circle cx="7" cy="8" r="1.8"/><circle cx="12" cy="6" r="1.8"/><circle cx="17" cy="8" r="1.8"/><path d="M8 14.2c0-2.3 1.9-4.2 4-4.2s4 1.9 4 4.2c0 2.3-1.9 3.6-4 3.6s-4-1.3-4-3.6z"/></svg>
    <svg class="paw-mark" style="top:188px; left:478px; width:14px; opacity:0.12" viewBox="0 0 24 24" fill="none" stroke="#F3F3F0" stroke-width="1.3" transform="rotate(8)"><circle cx="7" cy="8" r="1.8"/><circle cx="12" cy="6" r="1.8"/><circle cx="17" cy="8" r="1.8"/><path d="M8 14.2c0-2.3 1.9-4.2 4-4.2s4 1.9 4 4.2c0 2.3-1.9 3.6-4 3.6s-4-1.3-4-3.6z"/></svg>
    <svg class="paw-mark" style="top:250px; left:434px; width:13px; opacity:0.11" viewBox="0 0 24 24" fill="none" stroke="#F3F3F0" stroke-width="1.3" transform="rotate(-7)"><circle cx="7" cy="8" r="1.8"/><circle cx="12" cy="6" r="1.8"/><circle cx="17" cy="8" r="1.8"/><path d="M8 14.2c0-2.3 1.9-4.2 4-4.2s4 1.9 4 4.2c0 2.3-1.9 3.6-4 3.6s-4-1.3-4-3.6z"/></svg>
    <svg class="paw-mark" style="top:310px; left:392px; width:12px; opacity:0.10" viewBox="0 0 24 24" fill="none" stroke="#F3F3F0" stroke-width="1.3" transform="rotate(6)"><circle cx="7" cy="8" r="1.8"/><circle cx="12" cy="6" r="1.8"/><circle cx="17" cy="8" r="1.8"/><path d="M8 14.2c0-2.3 1.9-4.2 4-4.2s4 1.9 4 4.2c0 2.3-1.9 3.6-4 3.6s-4-1.3-4-3.6z"/></svg>

    <section class="hero">
      <h1>A dozen,<br>chosen on purpose.</h1>
      <p>No archive, no upload button — just the ones worth keeping, sorted by mood.</p>
    </section>

    <div class="pills-frame" role="tablist" aria-label="Filter by mood">
      <button class="pill active" role="tab" aria-selected="true">kitten</button>
      <button class="pill" role="tab" aria-selected="false">naps</button>
      <button class="pill" role="tab" aria-selected="false">outdoors</button>
      <button class="pill" role="tab" aria-selected="false">costumes</button>
    </div>
  </div>

  <div class="grid">
    <figure><div class="frame"></div><figcaption>First week home</figcaption></figure>
    <figure><div class="frame"></div><figcaption>Too small for the sofa</figcaption></figure>
    <figure><div class="frame"></div><figcaption>Discovering the window</figcaption></figure>
    <figure><div class="frame"></div><figcaption>Nap before the chaos</figcaption></figure>
    <figure><div class="frame"></div><figcaption>Learning to pounce</figcaption></figure>
    <figure><div class="frame"></div><figcaption>Still smaller than the shoe</figcaption></figure>
    <figure><div class="frame"></div><figcaption>First staredown with the dog</figcaption></figure>
    <figure><div class="frame"></div><figcaption>Sunbeam, correctly used</figcaption></figure>
    <figure><div class="frame"></div><figcaption>Box bigger than the cat</figcaption></figure>
    <figure><div class="frame"></div><figcaption>Practicing the loaf</figcaption></figure>
    <figure><div class="frame"></div><figcaption>Post-zoomies collapse</figcaption></figure>
    <figure><div class="frame"></div><figcaption>Almost a cat now</figcaption></figure>
  </div>

  <hr class="divider">
  <footer>
    <span>Taichung &middot; 2023–2026</span>
    <span class="status">handpicked</span>
  </footer>

</div>
<script>
  document.querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('.pill').forEach(o => { o.classList.remove('active'); o.setAttribute('aria-selected','false'); });
      p.classList.add('active');
      p.setAttribute('aria-selected','true');
    });
  });
</script>
</body>
</html>
